name: Deploy to GitHub Pages

on:
  push:
    branches: ['main', 'dev']
  workflow_dispatch:

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
          NODE_OPTIONS: '--max_old_space_size=9000'
          # Fork-only build: no eXist-DB / TEI Publisher service is started.
          # Heavy routes (fassungen + transkriptionen data, verssynopse)
          # are either fetched at runtime from upstream parzival.unibe.ch
          # or redirected client-side. See URL_UPSTREAM in
          # src/lib/constants.js.
        run: |
          npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 21600000
          error_count: 10
          reporting_interval: 15000
